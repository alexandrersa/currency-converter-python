services:
  api:
    build: .
    container_name: coin_converter_app
    ports:
      - '8000:80'
    env_file:
      - .env
    restart: unless-stopped

  db:
    image: postgres:17.6
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env

volumes:
  postgres_data:
